<style>

  apiKey: "AIzaSyAv_O4_lRnr8dJYyXxl17sVrbB8E8oeo_Q",
  authDomain: "aomori-trip-0804.firebaseapp.com",
  databaseURL: "https://aomori-trip-0804-default-rtdb.asia-southeast1.firebasedatabase.app",

  measurementId: "G-HFECXSPWDQ"
};
// ===================================================================

let fbEnabled = false;
let fbRef = null;
let dragInProgress = false;
let editingInProgress = false;

const LS_KEY = 'aomori_trip_state_v1';

// ---- 初始狀態 ----
function buildInitialState() {
  const itemsById = {};
  const itineraryOrder = {};
  const poolOrder = {};
  PAYLOAD.dayOrder.forEach(dayId => {
    itineraryOrder[dayId] = [];
    (PAYLOAD.itinerary[dayId] || []).forEach(it => {
      itemsById[it.id] = { name: it.name, time: it.time, desc: it.desc, maps: it.maps, custom: false, tier: null, kind: 'itinerary' };
      itineraryOrder[dayId].push(it.id);
    });
    poolOrder[dayId] = [];
    (PAYLOAD.pool[dayId] || []).forEach(it => {
      itemsById[it.id] = { name: it.name, time: null, desc: it.desc, maps: it.maps, custom: false, tier: it.tier, kind: it.kind };
      poolOrder[dayId].push(it.id);
    });
  });
  return { itineraryOrder, poolOrder, itemsById };
}

let state = buildInitialState();
const freshBaseline = buildInitialState(); // 保留一份「檔案內建最新資料」，用來跟雲端做差異比對
let hasMergedOnce = false;

// 只把「雲端筆記本裡還沒有的全新項目」補進去，不覆蓋、不刪除、不搬動任何既有內容
function mergeNewItemsFromFile(remoteState) {
  const newIds = [];
  for (const id in freshBaseline.itemsById) {
    if (!remoteState.itemsById[id]) {
      remoteState.itemsById[id] = freshBaseline.itemsById[id];
      newIds.push(id);
    }
  }
  if (newIds.length === 0) return false;
  PAYLOAD.dayOrder.forEach(dayId => {
    remoteState.itineraryOrder[dayId] = remoteState.itineraryOrder[dayId] || [];
    remoteState.poolOrder[dayId] = remoteState.poolOrder[dayId] || [];
    const freshItinIds = freshBaseline.itineraryOrder[dayId] || [];
    newIds.forEach(id => {
      const alreadyPlaced = remoteState.itineraryOrder[dayId].includes(id) || remoteState.poolOrder[dayId].includes(id);
      if (alreadyPlaced) return;
      const belongsToThisDay = freshItinIds.includes(id) || (freshBaseline.poolOrder[dayId] || []).includes(id);
      if (belongsToThisDay) {
        // 一律先放進候選清單，不自動排進行程表打亂使用者已經排好的順序，由使用者自己拖曳決定
        remoteState.poolOrder[dayId].push(id);
      }
    });
  });
  return true;
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.itemsById) return parsed;
    }
  } catch(e) {}
  return null;
}

function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e) {}
}

const localBaseline = loadLocal();
if (localBaseline) state = localBaseline;

let currentDay = PAYLOAD.dayOrder[0];
let sortableItinerary = null;
let sortablePool = null;

function setBanner(mode) {
  const el = document.getElementById('sync-banner');
  if (mode === 'ok') {
    el.className = 'ok';
    el.textContent = '☁️ 雲端同步已連接：已收到雲端最新資料，您和旅伴排的順序會即時同步。';
  } else if (mode === 'connecting') {
    el.className = 'off';
    el.textContent = '🔄 連接雲端中，請稍候……（如果超過10秒還是這樣，代表這個瀏覽器連不上雲端）';
  } else if (mode === 'timeout') {
    el.className = 'off';
    el.textContent = '⚠️ 連線逾時：設定碼沒問題，但這個瀏覽器一直收不到雲端資料，可能是快取或網路限制，請試試看強制重新整理（電腦按 Cmd/Ctrl+Shift+R，手機可清一下瀏覽器快取）。';
  } else {
    el.className = 'off';
    el.textContent = '⚠️ 尚未連接雲端同步，目前排序只暫存在這台裝置，重新整理／換裝置會看不到最新結果。';
  }
}

function initFirebase() {
  if (firebaseConfig.apiKey === 'REPLACE_ME' || !firebaseConfig.databaseURL || firebaseConfig.databaseURL === 'REPLACE_ME') {
    setBanner('off');
    return;
  }
  try {
    firebase.initializeApp(firebaseConfig);
    fbRef = firebase.database().ref('trip/state');
    fbEnabled = true;
    setBanner('connecting');
    let fbConfirmed = false;
    const timeoutId = setTimeout(() => {
      if (!fbConfirmed) setBanner('timeout');
    }, 10000);
    fbRef.on('value', snap => {
      if (!fbConfirmed) { fbConfirmed = true; clearTimeout(timeoutId); }
      if (dragInProgress || editingInProgress) return;
      const val = snap.val();
      if (val && val.itemsById) {
        let merged = val;
        if (!hasMergedOnce) {
          hasMergedOnce = true;
          const changed = mergeNewItemsFromFile(merged);
          if (changed) fbRef.set(merged);
        }
        state = merged;
        saveLocal();
        renderAll();
        setBanner('ok');
      } else {
        fbRef.set(state);
        setBanner('ok');
      }
    }, err => {
      console.error('Firebase 監聽失敗', err);
      clearTimeout(timeoutId);
      setBanner('timeout');
    });
  } catch (e) {
    console.error(e);
    setBanner('off');
  }
}

// 手機/瀏覽器從背景切回前景時，強制重新抓一次雲端最新資料
// （手機鎖螢幕或切背景常常會讓即時連線斷掉、不會自動補抓）
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && fbEnabled && fbRef) {
    fbRef.once('value').then(snap => {
      if (dragInProgress || editingInProgress) return;
      const val = snap.val();
      if (val && val.itemsById) {
        state = val;
        saveLocal();
        renderAll();
      }
    }).catch(err => console.error('回到前景重新抓取失敗', err));
  }
});

function persist() {
  saveLocal();
  if (fbEnabled && fbRef) {
    fbRef.set(state).catch(err => {
      console.error('Firebase 寫入失敗', err);
      alert('同步失敗，這筆變更沒有送到雲端：' + err.message + '\n（本機仍會暫存，請檢查網路後重新整理再試一次）');
    });
  }
}

function escapeHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function itineraryCardHTML(id) {
  const it = state.itemsById[id];
  const mapsHtml = it.maps ? `<a class="maps-link" href="${it.maps}" target="_blank" rel="noopener">📍 Google Maps 導航</a>` : '';
  return `<li class="card" data-id="${id}">
    <span class="drag-handle">⋮⋮</span>
    <div class="card-body">
      <div class="card-top">
        <span class="time-badge" data-field="time" data-id="${id}">${escapeHtml(it.time || '--:--')}</span>
        <span class="name-text" data-field="name" data-id="${id}">${escapeHtml(it.name)}</span>
      </div>
      ${it.desc ? `<div class="desc-text">${escapeHtml(it.desc)}</div>` : ''}
      ${mapsHtml}
    </div>
    <button class="delete-btn" data-action="delete-itinerary" data-id="${id}" title="移回下面候選清單">✕</button>
  </li>`;
}

function poolCardHTML(id) {
  const it = state.itemsById[id];
  const mapsHtml = it.maps ? `<a class="maps-link" href="${it.maps}" target="_blank" rel="noopener">📍 Google Maps 導航</a>` : '';
  return `<li class="pool-card" data-id="${id}">
    <span class="drag-handle">⋮⋮</span>
    <div class="card-body">
      <div class="card-top">
        ${it.tier ? `<span class="tier-badge">${escapeHtml(it.tier)}</span>` : ''}
        <span class="name-text" data-field="name" data-id="${id}">${escapeHtml(it.name)}</span>
      </div>
      ${it.desc ? `<div class="desc-text">${escapeHtml(it.desc)}</div>` : ''}
      ${mapsHtml}
    </div>
    <button class="delete-btn" data-action="delete-pool" data-id="${id}" title="永久刪除">🗑</button>
  </li>`;
}

function renderDayTabs() {
  const nav = document.getElementById('day-tabs');
  nav.innerHTML = PAYLOAD.dayOrder.map(dayId => {
    const meta = PAYLOAD.dayMeta[dayId];
    const active = dayId === currentDay ? 'active' : '';
    return `<button class="${active}" data-day="${dayId}">${meta.label}</button>`;
  }).join('');
  nav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentDay = btn.dataset.day;
      renderAll();
    });
  });
}

function renderDayHeader() {
  const meta = PAYLOAD.dayMeta[currentDay];
  document.getElementById('day-title').textContent = meta.title;
  document.getElementById('day-intro').textContent = meta.intro;
  document.getElementById('day-warn').textContent = '⚠️ ' + meta.warning;
  document.getElementById('pool-title').textContent = '🍽 美食＆景點候選（拖曳到上面行程表，時間可點一下自行輸入）';
}

function renderLists() {
  const itUl = document.getElementById('itinerary-list');
  const poolUl = document.getElementById('pool-list');
  itUl.innerHTML = state.itineraryOrder[currentDay].map(itineraryCardHTML).join('');
  poolUl.innerHTML = state.poolOrder[currentDay].map(poolCardHTML).join('');

  if (sortableItinerary) sortableItinerary.destroy();
  if (sortablePool) sortablePool.destroy();

  const groupName = 'shared-' + currentDay;

  sortableItinerary = new Sortable(itUl, {
    group: groupName,
    animation: 150,
    handle: '.drag-handle',
    onStart: () => dragInProgress = true,
    onEnd: () => { dragInProgress = false; },
    onAdd: (evt) => {
      const id = evt.item.dataset.id;
      // 從候選池拖進來的項目，補上時間欄位，重新渲染成行程卡片樣式
      const it = state.itemsById[id];
      if (it.time === null || it.time === undefined) it.time = '--:--';
      it.kind = 'itinerary';
      evt.item.outerHTML = itineraryCardHTML(id);
      syncOrdersFromDom();
    },
    onUpdate: () => syncOrdersFromDom(),
    onRemove: () => syncOrdersFromDom(),
  });

  sortablePool = new Sortable(poolUl, {
    group: groupName,
    animation: 150,
    handle: '.drag-handle',
    onStart: () => dragInProgress = true,
    onEnd: () => { dragInProgress = false; },
    onAdd: (evt) => {
      const id = evt.item.dataset.id;
      evt.item.outerHTML = poolCardHTML(id);
      syncOrdersFromDom();
    },
    onUpdate: () => syncOrdersFromDom(),
    onRemove: () => syncOrdersFromDom(),
  });
}

function syncOrdersFromDom() {
  const itUl = document.getElementById('itinerary-list');
  const poolUl = document.getElementById('pool-list');
  state.itineraryOrder[currentDay] = [...itUl.children].map(li => li.dataset.id);
  state.poolOrder[currentDay] = [...poolUl.children].map(li => li.dataset.id);
  persist();
}

function renderAll() {
  renderDayTabs();
  renderDayHeader();
  renderLists();
}

// ---- 行內編輯（點時間 / 點店名）----
document.addEventListener('click', (e) => {
  const target = e.target.closest('[data-field]');
  if (!target) return;
  if (target.tagName === 'INPUT') return;
  const field = target.dataset.field;
  const id = target.dataset.id;
  const current = state.itemsById[id][field] || '';
  const input = document.createElement('input');
  input.type = 'text';
  input.value = current;
  input.style.font = 'inherit';
  input.style.width = field === 'time' ? '70px' : '160px';
  target.replaceWith(input);
  input.focus();
  input.select();
  editingInProgress = true;
  const commit = () => {
    state.itemsById[id][field] = input.value.trim();
    editingInProgress = false;
    persist();
    renderLists();
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') input.blur(); });
});

// ---- 從行程表移除：退回下面備選（不是永久刪除）----
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action="delete-itinerary"]');
  if (!btn) return;
  const id = btn.dataset.id;
  if (!confirm('把這筆行程移回下面的候選清單嗎？')) return;
  state.itineraryOrder[currentDay] = state.itineraryOrder[currentDay].filter(x => x !== id);
  if (!state.poolOrder[currentDay].includes(id)) {
    state.poolOrder[currentDay].push(id);
  }
  persist();
  renderLists();
});

// ---- 候選清單永久刪除 ----
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action="delete-pool"]');
  if (!btn) return;
  const id = btn.dataset.id;
  if (!confirm('確定要永久刪除這筆候選項目嗎？刪除後無法復原、也拉不回來。')) return;
  state.poolOrder[currentDay] = state.poolOrder[currentDay].filter(x => x !== id);
  delete state.itemsById[id];
  persist();
  renderLists();
});

// ---- 新增空白卡 ----
document.getElementById('add-toggle').addEventListener('click', () => {
  document.getElementById('add-form').classList.toggle('open');
});
document.getElementById('add-confirm').addEventListener('click', () => {
  const timeVal = document.getElementById('add-time').value.trim() || '--:--';
  const nameVal = document.getElementById('add-name').value.trim();
  const mapsVal = document.getElementById('add-maps').value.trim();
  const descVal = document.getElementById('add-desc').value.trim();
  if (!nameVal) { alert('請至少輸入店名／地點'); return; }
  const id = 'custom-' + Date.now();
  state.itemsById[id] = { name: nameVal, time: timeVal, desc: descVal, maps: mapsVal || null, custom: true, tier: null, kind: 'itinerary' };
  state.itineraryOrder[currentDay].push(id);
  document.getElementById('add-time').value = '';
  document.getElementById('add-name').value = '';
  document.getElementById('add-maps').value = '';
  document.getElementById('add-desc').value = '';
  document.getElementById('add-form').classList.remove('open');
  persist();
  renderLists();
});

// ---- 新增候選（美食／景點）----
document.getElementById('add-pool-toggle').addEventListener('click', () => {
  document.getElementById('add-pool-form').classList.toggle('open');
});
document.getElementById('add-pool-confirm').addEventListener('click', () => {
  const tierVal = document.getElementById('add-pool-tier').value.trim();
  const nameVal = document.getElementById('add-pool-name').value.trim();
  const mapsVal = document.getElementById('add-pool-maps').value.trim();
  const descVal = document.getElementById('add-pool-desc').value.trim();
  if (!nameVal) { alert('請至少輸入店名／地點'); return; }
  const id = 'custompool-' + Date.now();
  state.itemsById[id] = { name: nameVal, time: null, desc: descVal, maps: mapsVal || null, custom: true, tier: tierVal || '自訂候選', kind: 'custom' };
  state.poolOrder[currentDay].push(id);
  document.getElementById('add-pool-tier').value = '';
  document.getElementById('add-pool-name').value = '';
  document.getElementById('add-pool-maps').value = '';
  document.getElementById('add-pool-desc').value = '';
  document.getElementById('add-pool-form').classList.remove('open');
  persist();
  renderLists();
});

// ---- 啟動 ----
initFirebase();
renderAll();
</script>
